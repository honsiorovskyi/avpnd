# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# avpnd wraps the macOS AWS VPN Client, so only macOS is built.
before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...
    # build/extensions/*.zip, attached to the release below
    - scripts/build-extensions.sh {{ .Version }}

builds:
  - main: .
    binary: avpnd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: build/extensions/*.zip

release:
  extra_files:
    - glob: build/extensions/*.zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
